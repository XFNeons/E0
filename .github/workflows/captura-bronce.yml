name: Captura capa Bronce

on:
  schedule:
    # Lunes a las 13:17 UTC (07:17 hora de Colima). La EMEC se publica una vez al mes;
    # correr cada semana asegura capturar la publicación sin saturar la API
    # (si no hay cambios, el extractor no duplica archivos).
    - cron: "17 13 * * 1"
  workflow_dispatch: {}   # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write          # necesario para hacer commit de los datos crudos

concurrency:
  group: captura-bronce
  cancel-in-progress: false

defaults:
  run:
    working-directory: E0   # el proyecto de la entrega E0 vive en esta carpeta

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: E0/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas rápidas
        run: python -m unittest discover -s tests -v

      - name: Ejecutar extractor
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python src/extractor_bronce.py

      - name: Guardar datos crudos en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronze
          if git diff --cached --quiet; then
            echo "Sin cambios en Bronce"
          else
            git commit -m "bronce: captura automática $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
